version: "3.9"
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_pass
      POSTGRES_DB: crm_perfumeria
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_perfumeria"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: "postgresql://crm_user:crm_pass@db:5432/crm_perfumeria"
      JWT_SECRET: "${JWT_SECRET:-cambia_este_secreto_jwt}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-cambia_este_secreto_refresh}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-15m}"
      JWT_REFRESH_EXPIRES_IN: "${JWT_REFRESH_EXPIRES_IN:-7d}"
      PORT: "3002"
      SEED_ADMIN_NOMBRE: "${SEED_ADMIN_NOMBRE:-Administrador}"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:-admin@santacruzessence.com}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-Admin123}"

volumes:
  db_data:
